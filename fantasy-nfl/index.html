<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War Room Fantasy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#0d1317">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="War Room">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky scoreboard header + tab rail; each view is a responsive grid of panels.
   Signature detail: live game cards draw a mini field with the yellow first-down line. */
:root{
  --bg:#0d1317; --panel:#141c22; --panel-2:#1b252d; --line:#25323c; --fg:#e6ebee; --muted:#8b9ba7;
  --accent:#ffd23f; --accent-ink:#ffd23f; --on-accent:#16130a; --turf:#1f3a2c; --turf-line:#2f5a43;
  --good:#3ed48b; --warn:#f3a52a; --bad:#f2565d; --info:#5cb2f7;
  --f-display:'Saira Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f1f4f3; --panel:#ffffff; --panel-2:#e9eeed; --line:#d3dbdb; --fg:#0f171c; --muted:#56666f;
  --accent:#f2c200; --accent-ink:#8a6800; --on-accent:#16130a; --turf:#2f6b4c; --turf-line:#4f8f6c;
  --good:#12844f; --warn:#a96600; --bad:#c42f38; --info:#1c6bb0; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f1f4f3; --panel:#ffffff; --panel-2:#e9eeed; --line:#d3dbdb; --fg:#0f171c; --muted:#56666f;
  --accent:#f2c200; --accent-ink:#8a6800; --on-accent:#16130a; --turf:#2f6b4c; --turf-line:#4f8f6c;
  --good:#12844f; --warn:#a96600; --bad:#c42f38; --info:#1c6bb0; color-scheme:light }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:6px;height:26px;background:var(--accent);transform:skewX(-14deg)}
.wk{font:700 14px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:6px 9px;border-radius:4px}
.lg{font-weight:600;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.status{font:500 12px/1.2 var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font:700 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;color:var(--muted);padding:11px 12px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs a .badge{display:inline-block;min-width:18px;padding:2px 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/1 var(--f-mono);vertical-align:2px}

main{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:1100px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2,.h2{font:700 19px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-wrap:balance}
.panel>h2 small,.h2 small{font:500 12px/1.2 var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted)}
.vh{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.tbl{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--panel-2)}
.t tr.mine td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.pl{display:flex;align-items:center;gap:9px;min-width:0}
.pl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .m{font-size:12px;color:var(--muted);white-space:nowrap}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel-2);flex:none}
.av.sm{width:24px;height:24px}
.av.lg{width:96px;height:96px}
.logo{width:26px;height:26px;object-fit:contain;flex:none}
.logo.lg{width:44px;height:44px}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.pos{font:700 11px/1 var(--f-mono);padding:4px 5px;border-radius:4px;min-width:34px;text-align:center;display:inline-block}
.pos-QB{background:#e0526b33;color:#ef6f86}.pos-RB{background:#2fbf8f33;color:#3fd3a0}.pos-WR{background:#4a9cf033;color:#6db1f7}
.pos-TE{background:#f0934a33;color:#f5a466}.pos-K{background:#a58bf033;color:#b9a3f7}.pos-DEF{background:#8f9ba633;color:#a9b4be}
.pos-FLEX,.pos-SUPER_FLEX,.pos-WRRB_FLEX,.pos-REC_FLEX{background:var(--panel-2);color:var(--fg)}
:root[data-theme="light"] .pos-QB{color:#b02842}:root[data-theme="light"] .pos-RB{color:#0f7d58}:root[data-theme="light"] .pos-WR{color:#1d64b0}
:root[data-theme="light"] .pos-TE{color:#a8540f}:root[data-theme="light"] .pos-K{color:#5d43b5}:root[data-theme="light"] .pos-DEF{color:#4c5862}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .pos-QB{color:#b02842}:root:not([data-theme="dark"]) .pos-RB{color:#0f7d58}:root:not([data-theme="dark"]) .pos-WR{color:#1d64b0}:root:not([data-theme="dark"]) .pos-TE{color:#a8540f}:root:not([data-theme="dark"]) .pos-K{color:#5d43b5}:root:not([data-theme="dark"]) .pos-DEF{color:#4c5862}}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
input[type=text],input[type=search],select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-width:0}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 11px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:start;padding:10px 12px 10px 0;background:var(--panel-2);border-radius:8px;overflow:hidden}
.alert>.bar{align-self:stretch;background:var(--muted)}
.alert.bad>.bar{background:var(--bad)}.alert.warn>.bar{background:var(--warn)}.alert.good>.bar{background:var(--good)}.alert.info>.bar{background:var(--info)}
.alert b{display:block}
.alert p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

.score{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.score .side{display:flex;flex-direction:column;gap:4px;min-width:0}
.score .side.r{align-items:flex-end;text-align:right}
.score .pts{font:800 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score .vs{font:700 14px var(--f-display);color:var(--muted)}
.wp{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden;display:flex;margin-top:12px}
.wp span{background:var(--accent)}

.games{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.game{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.game.in{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.game .tm{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center}
.game .tm b{font:700 17px/1 var(--f-display);letter-spacing:.03em}
.game .tm .sc{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.game .tm.lose{opacity:.55}
.game .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.game .poss::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
.field{position:relative;height:22px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--turf) 0 9.5%,var(--turf-line) 9.5% 10%);overflow:hidden}
.field .ez{position:absolute;top:0;bottom:0;width:6%;background:color-mix(in srgb,var(--turf) 60%,#000)}
.field .fd{position:absolute;top:0;bottom:0;width:3px;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.field .ball{position:absolute;top:50%;width:12px;height:8px;margin:-4px 0 0 -6px;border-radius:50%;background:#8b4a1f;border:1px solid #f1d7b8}
.field .los{position:absolute;top:0;bottom:0;width:2px;background:#5cb2f7}
.lastplay{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{display:flex;gap:4px;flex-wrap:wrap}

.pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.pcard:hover{border-color:var(--muted)}
.pcard .ph{height:118px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.pcard .ph img.hs{height:112px;width:auto;max-width:none;object-fit:contain;position:relative}
.pcard .ph img.tl{position:absolute;left:8px;top:8px;width:30px;height:30px;opacity:.95}
.pcard .bd{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px}
.pcard .bd b{font:700 16px/1.1 var(--f-display);letter-spacing:.02em}
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.tcard{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;padding:0}
.tcard .tb{display:flex;align-items:center;gap:12px;padding:12px 14px;color:#fff}
.tcard .tb b{font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.tcard .tb small{opacity:.8;display:block;font-size:12px;margin-top:3px}
.tcard .dv{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:10px 12px}
.tcard .dv div{text-align:center;font-size:11px;color:var(--muted)}
.tcard .dv div span{display:block;font:600 14px var(--f-mono);margin-top:2px}

.news{display:flex;flex-direction:column}
.ni{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ni:last-child{border-bottom:0}
.ni h3{margin:0 0 3px;font-size:15px;line-height:1.3}
.ni h3 a{text-decoration:none}
.ni h3 a:hover{text-decoration:underline}
.ni p{margin:0;color:var(--muted);font-size:13.5px;max-width:80ch}
.ni .src{font:600 11px var(--f-mono);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em}
.thumb{width:84px;height:56px;border-radius:6px;object-fit:cover;background:var(--panel-2)}

.modal{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 60%,transparent);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(980px,100%);overflow:hidden}
.sheet .hero{display:flex;gap:18px;align-items:flex-end;padding:18px 18px 0;color:#fff;position:relative;flex-wrap:wrap}
.sheet .hero img.hs{height:150px;width:auto;max-width:none}
.sheet .hero h2{font:800 38px/1 var(--f-display);text-transform:uppercase;margin:0}
.sheet .hero .x{position:absolute;right:12px;top:12px;background:#0006;color:#fff;border:0;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:15px}
.sheet .body{padding:18px;display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.kv small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kv span{font:600 18px var(--f-mono)}
svg text{fill:var(--muted);font:11px var(--f-mono)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.load{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.trade{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:820px){.trade{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.chk:hover{background:var(--panel-2)}
.chk input{accent-color:var(--accent);width:17px;height:17px}
.verdict{font:800 30px/1 var(--f-display);text-transform:uppercase}
.big{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.label{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpis>div{background:var(--panel-2);border-radius:8px;padding:12px}
.log{font:12px/1.5 var(--f-mono);color:var(--muted);max-height:180px;overflow:auto;white-space:pre-wrap}
.outlook{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;margin:0;max-width:85ch}
.pbar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;min-width:70px}
.pbar span{display:block;height:100%;background:var(--accent)}
.hc{font:600 11px/1 var(--f-mono);text-align:center;padding:6px 4px;border-radius:4px;white-space:nowrap}
.hc.g2{background:color-mix(in srgb,var(--good) 38%,transparent)}.hc.g1{background:color-mix(in srgb,var(--good) 18%,transparent)}
.hc.b1{background:color-mix(in srgb,var(--warn) 22%,transparent)}.hc.b2{background:color-mix(in srgb,var(--bad) 32%,transparent)}
.hc.bye{background:var(--panel-2);color:var(--bad)}
th.po{color:var(--accent-ink)}
.t td.cell{padding:3px 2px}
.facts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.fact{background:var(--panel-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fact .big{font-size:28px}
.idea{--n:2;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;align-items:start;background:var(--panel-2);border-radius:8px;padding:12px}
@media (max-width:700px){.idea{grid-template-columns:1fr}}
.chk select{flex:none}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
code{font:13px var(--f-mono);background:var(--panel-2);padding:2px 6px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i></i>War Room</div>
    <span class="wk" id="wk">Semana —</span>
    <span class="lg" id="lgname">Nenhuma liga conectada</span>
    <span class="spacer"></span>
    <span class="status"><span class="dot" id="livedot"></span><span id="status">Iniciando…</span></span>
    <button class="iconbtn" id="refresh" title="Atualizar agora">↻ Atualizar</button>
    <button class="iconbtn" id="theme" title="Alternar tema">Tema: sistema</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<div class="modal" id="modal" hidden></div>

<script>
'use strict';
/* ====================== CONSTANTES ====================== */
const FP = ['QB','RB','WR','TE','K','DEF'];
const POSQ = FP.map(p => 'position[]=' + p).join('&');
const SL = 'https://api.sleeper.app';
// site.api.espn.com é bloqueado por alguns navegadores (proteção contra rastreamento); site.web.api serve as mesmas rotas
const ESPNH = 'https://site.web.api.espn.com', ESPNH_ALT = 'https://site.api.espn.com';
const API = {
  state: `${SL}/v1/state/nfl`,
  user: u => `${SL}/v1/user/${encodeURIComponent(u)}`,
  leagues: (uid, s) => `${SL}/v1/user/${uid}/leagues/nfl/${s}`,
  league: id => `${SL}/v1/league/${id}`,
  rosters: id => `${SL}/v1/league/${id}/rosters`,
  users: id => `${SL}/v1/league/${id}/users`,
  matchups: (id, w) => `${SL}/v1/league/${id}/matchups/${w}`,
  tx: (id, w) => `${SL}/v1/league/${id}/transactions/${w}`,
  players: `${SL}/v1/players/nfl`,
  trending: t => `${SL}/v1/players/nfl/trending/${t}?lookback_hours=24&limit=150`,

const DB = {

    return this.db;

  async get(k) { try { const db = await this.open(); return await new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); }); } catch { return undefined; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch {} },

};
async function cached(key, maxAge, loader) {
  const hit = await DB.get(key);

  try { const v = await loader(); DB.set(key, { t: Date.now(), v }); return v; }
  catch (e) { if (hit) { logMsg(`${key}: usando cache (${e.message})`); return hit.v; } throw e; }
}

  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(m[2]);
  let h = +m[4] % 12; if (m[7] === 'PM') h += 12;
  const off = { PDT: 7, PST: 8, EDT: 4, EST: 5, CDT: 5, CST: 6, MDT: 6, MST: 7 }[m[8]] ?? 0;
  return Date.UTC(+m[3], mon, +m[1], h + off, +m[5], +m[6]);
}

  const pts = [];

    let lat, lon, retr = false;
    if (g.neutral && g.venue.city) {
      const key = `${g.venue.city}|${g.venue.country || ''}`;

function wxInfo(g) {

function tradeIdeas() {

}

const gameSort = (a, b) => ({ in: 0, pre: 1, post: 2 }[a.state] - { in: 0, pre: 1, post: 2 }[b.state]) || (Date.parse(a.date) - Date.parse(b.date));
function gameCard(g) {
  const tm = (s, o) => {
    const poss = g.sit && g.sit.poss === s.id;
    const lose = g.state === 'post' && s.score < o.score;
    return `<div class="tm ${lose ? 'lose' : ''}">${tLogo(s.abbr)}<div><b class="${poss ? 'poss' : ''}">${esc(s.abbr)}</b> <span class="muted" style="font-size:12px">${esc(s.rec)}${S.implied[s.abbr] && g.state === 'pre' ? ` · ${f1(S.implied[s.abbr])} pts impl.` : ''}</span></div><span class="sc">${g.state === 'pre' ? '' : s.score}</span></div>`;
  };
  let field = '';
  if (g.state === 'in' && g.sit && g.sit.ptext) {
    const possAbbr = g.sit.poss === g.home.id ? g.home.abbr : g.away.abbr;
    const m = /([A-Z]{2,3})\s+(\d+)/.exec(g.sit.ptext); let yds = 50;
    if (m) { const side = ESPN2SL[m[1]] || m[1]; yds = side === possAbbr ? +m[2] : 100 - +m[2]; }
    const x = 6 + yds * 0.88, fd = 6 + Math.min(100, yds + (+g.sit.dist || 0)) * 0.88;
    field = `<div class="field" title="${esc(possAbbr)} ataca →"><span class="ez" style="left:0"></span><span class="ez" style="right:0"></span><span class="los" style="left:${x}%"></span><span class="fd" style="left:${fd}%"></span><span class="ball" style="left:${x}%"></span></div>
      <div class="meta"><span>${esc(g.sit.dd || '')}${g.sit.rz ? ' · <b style="color:var(--bad)">RED ZONE</b>' : ''}</span><span>${esc(possAbbr)} com a bola</span></div>${g.sit.last ? `<div class="lastplay">${esc(g.sit.last)}</div>` : ''}`;
  }
  const mine = S.myRoster ? (S.myRoster.players || []).filter(pid => { const t = S.players[pid]?.team; return t === g.home.abbr || t === g.away.abbr; }) : [];
  const when = g.state === 'pre' ? new Date(g.date).toLocaleString('pt-BR', { weekday: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : g.detail;
  return `<div class="game ${g.state}">${tm(g.away, g.home)}${tm(g.home, g.away)}${field}
    <div class="meta"><span>${g.state === 'in' ? '<b style="color:var(--bad)">AO VIVO</b> · ' : ''}${esc(when)}</span><span>${g.state === 'pre' ? oddsText(g) : esc(g.tv)}</span></div>
    ${g.state !== 'post' && wxInfo(g) ? `<div class="meta"><span class="pill ${wxInfo(g).cls}">${esc(wxInfo(g).txt)}</span><span>${esc(g.venue.name || '')}${g.neutral && g.venue.city ? ' · ' + esc(g.venue.city) : ''}</span></div>` : ''}
    ${mine.length ? `<div class="mini" title="Seus jogadores neste jogo">${mine.map(pid => `<button class="pill" data-player="${pid}" style="border:0;cursor:pointer">${esc(S.players[pid].n.split(' ').slice(-1)[0])}${myPts(pid) != null ? ` <span class="num">${f1(myPts(pid))}</span>` : ''}</button>`).join('')}</div>` : ''}</div>`;
}
function myPts(pid) { const mm = myMatch(); return mm?.me?.players_points?.[pid] ?? null; }

// Sugere FAAB para equilibrar uma troca entre dois times, pela diferença de VOR
function balanceFaab(x) {
  const fi = faabInfo(); if (!fi || x.teams.length !== 2) return {};
  const my = S.myRoster.roster_id, rid = x.teams[1], dvl = dollarValue();
  const gap = Object.keys(x.moves).reduce((s, p) => s + (x.moves[p] === my ? 1 : -1) * rosValue(p).vor, 0);
  const cap = Math.round(fi.budget * 0.4);
  if (gap > 6) { const amt = Math.min(faabLeft(my), cap, Math.round(gap / dvl)); return amt >= 1 ? { [my]: { amt, to: rid } } : {}; }
  if (gap < -6) { const amt = Math.min(faabLeft(rid), cap, Math.round(-gap / dvl)); return amt >= 1 ? { [rid]: { amt, to: my } } : {}; }
  return {};
}

function tradeIdeas3() {
  const my = S.myRoster.roster_id; const vc = {}; const val = pid => (vc[pid] ??= ev(pid) * rosInj(S.players[pid]));
  const R = {}; S.rosters.forEach(r => R[r.roster_id] = (r.players || []).filter(p => !(r.reserve || []).includes(p)));

  const fcOf = pid => S.fc[pid]?.v || Math.max(1, rosValue(pid).vor * 25); const okR = (inn, out) => { const q = fcOf(inn) / fcOf(out); return q >= 0.6 && q <= 1.5; };
  const others = Object.keys(R).map(Number).filter(r => r !== my); const ideas = [];
  for (const a of top[my]) for (const A of others) for (const b of top[A]) {

    for (const B of others) { if (B === A) continue; for (const c of top[B]) {

  }
  ideas.sort((x, y) => y.score - x.score); const seen = new Set(), out = [];

}

const pctTxt = v => v == null ? '—' : v >= 0.995 ? '>99%' : v > 0 && v < 0.005 ? '<1%' : Math.round(v * 100) + '%';

VIEWS.liga = v => {
  if (!S.league) { v.innerHTML = `<h1 class="vh">Liga</h1>${connectCTA()}`; return; }
  const sim = S.sim, ls = leagueStats(), my = S.myRoster?.roster_id, st = S.league.settings || {};

  let html = `<h1 class="vh">${esc(S.league.name)}</h1><p class="sub">${S.rosters.length} times · ${sim.P} vão aos playoffs a partir da semana ${sim.pws}${sim.nBye ? ` · os ${sim.nBye} primeiros folgam na 1ª rodada` : ''}${st.waiver_type === 2 ? ` · FAAB de $${st.waiver_budget}` : ''}. As chances vêm de ${sim.N.toLocaleString('pt-BR')} simulações do resto da temporada, com as projeções do War Room e o calendário real da liga.</p><div class="grid">`;
  if (my != null && sim.res[my]) {

    const tip = r.po >= 0.8 ? `Você é favorito. Use a profundidade do banco para subir o teto dos titulares e confira o calendário das semanas ${sim.pws}–${sim.pws + 2} na aba Calendário antes de trocar.`
      : r.po >= 0.45 ? `Briga direta pela vaga.${pW != null ? ` Este jogo vale muito: vencendo, sua chance vai a ${pctTxt(pW)}; perdendo, cai para ${pctTxt(pL)}.` : ''} Prefira trocas que melhoram o titular já, não daqui a um mês.`
      : r.po >= 0.15 ? 'Azarão. Você precisa de pontos já: arrisque em jogadores de teto alto, seja agressivo no waiver e use o FAAB agora, porque ele não vale nada se você ficar fora.'
      : 'Chance pequena. Faça trocas de risco por jogadores explosivos; empatar no meio da tabela não ajuda.';
    html += `<section class="panel c12"><h2>Sua situação</h2><div class="kpis"><div><div class="label">Chance de playoffs</div><div class="big">${pctTxt(r.po)}</div></div><div><div class="label">Folga na 1ª rodada</div><div class="big">${sim.nBye ? pctTxt(r.bye) : '—'}</div></div>
      <div><div class="label">Título</div><div class="big">${pctTxt(r.champ)}</div></div><div><div class="label">Vitórias projetadas</div><div class="big">${f1(r.wins)}</div></div>
      ${pW != null ? `<div><div class="label">Se vencer / perder hoje</div><div class="big" style="font-size:24px">${pctTxt(pW)} <span class="muted">/</span> ${pctTxt(pL)}</div></div>` : ''}</div><p class="outlook" style="margin-top:14px">${esc(tip)}</p></section>`;
  }
  html += playoffPictureHTML(sim);
  const simRows = [...S.rosters].sort((a, b) => sim.res[b.roster_id].po - sim.res[a.roster_id].po || sim.res[b.roster_id].wins - sim.res[a.roster_id].wins);
  html += `<section class="panel c12"><h2>Chance de playoffs</h2><div class="tbl"><table class="t"><thead><tr><th>#</th><th>Time</th><th class="r">V-D</th><th class="r">Vitórias proj.</th><th>Playoffs</th><th class="r"></th>${sim.nBye ? '<th class="r">Folga</th>' : ''}<th class="r">1º lugar</th><th class="r">Título</th></tr></thead><tbody>
    ${simRows.map((r, i) => { const x = sim.res[r.roster_id]; return `<tr class="${r.roster_id === my ? 'mine' : ''}"><td class="num">${i + 1}</td><td>${teamCell(r.roster_id)}</td><td class="r num">${r.settings.wins}-${r.settings.losses}</td><td class="r num">${f1(x.wins)}</td><td><div class="pbar"><span style="width:${x.po * 100}%"></span></div></td><td class="r num"><b>${pctTxt(x.po)}</b></td>${sim.nBye ? `<td class="r num">${pctTxt(x.bye)}</td>` : ''}<td class="r num">${pctTxt(x.s1)}</td><td class="r num">${pctTxt(x.champ)}</td></tr>`; }).join('')}</tbody></table></div></section>`;
  html += `<section class="panel c7"><h2>Power ranking <small>all-play, pontos e forma</small></h2><div class="tbl"><table class="t"><thead><tr><th>#</th><th>Time</th><th class="r">V-D</th><th class="r" title="Recorde se tivesse enfrentado todos os times toda semana">All-play</th><th class="r" title="Vitórias reais menos as esperadas pelo all-play">Sorte</th><th class="r">PF</th><th class="r" title="Pontos feitos / máximo possível com a escalação ideal">Eficiência</th><th class="r">Últ. 3</th></tr></thead><tbody>
    ${ls.rows.map((r, i) => `<tr class="${r.rid === my ? 'mine' : ''}"><td class="num">${i + 1}</td><td>${teamCell(r.rid)}</td><td class="r num">${r.wins}-${r.losses}</td><td class="r num">${Math.round(r.ap)}-${Math.round(r.apL)}</td><td class="r num" style="color:${r.luck > 0.5 ? 'var(--good)' : r.luck < -0.5 ? 'var(--bad)' : 'inherit'}">${r.luck >= 0 ? '+' : ''}${f1(r.luck)}</td><td class="r num">${f1(r.pf)}</td><td class="r num">${r.eff ? pct(r.eff) : '—'}</td><td class="r num">${f1(r.rec3)}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:13px;margin-bottom:0">Sorte positiva: o time venceu mais do que os pontos justificam e tende a cair. Negativa: perdeu jogos que merecia ganhar.</p></section>`;
  const eff = [...ls.rows].filter(r => r.eff).sort((a, b) => b.eff - a.eff), lucky = [...ls.rows].sort((a, b) => b.luck - a.luck), act = [...ls.rows].sort((a, b) => b.moves - a.moves), spend = [...ls.rows].sort((a, b) => b.faab - a.faab);
  const fact = (lbl, big, sub) => `<div class="fact"><span class="label">${lbl}</span><span class="big">${big}</span><span class="muted" style="font-size:13px">${sub}</span></div>`;
  const facts = [];
  if (ls.hi) facts.push(fact('Maior pontuação', f1(ls.hi.pts), `${esc(ownerName(ls.hi.rid))} · semana ${ls.hi.w}`));
  if (ls.lo) facts.push(fact('Menor pontuação', f1(ls.lo.pts), `${esc(ownerName(ls.lo.rid))} · semana ${ls.lo.w}`));
  if (ls.blow) facts.push(fact('Maior atropelo', '+' + f1(ls.blow.d), `${esc(ownerName(ls.blow.win))} ${f1(ls.blow.ws)} × ${f1(ls.blow.ls)} ${esc(ownerName(ls.blow.los))} · sem ${ls.blow.w}`));
  if (ls.close) facts.push(fact('Jogo mais apertado', f1(ls.close.d), `${esc(ownerName(ls.close.win))} ${f1(ls.close.ws)} × ${f1(ls.close.ls)} ${esc(ownerName(ls.close.los))} · sem ${ls.close.w}`));
  if (ls.best) facts.push(fact('Melhor atuação individual', f1(ls.best.pts), `${pname(ls.best.pid)} por ${esc(ownerName(ls.best.rid))} · sem ${ls.best.w}`));
  if (eff.length) { facts.push(fact('Gerente mais eficiente', pct(eff[0].eff), `${esc(ownerName(eff[0].rid))} escala quase sempre o time ideal`)); const w = eff[eff.length - 1]; facts.push(fact('Mais pontos no banco', f1(w.bench), `${esc(ownerName(w.rid))} deixou isso fora da escalação`)); }
  facts.push(fact('Mais sortudo', '+' + f1(lucky[0].luck), `${esc(ownerName(lucky[0].rid))} tem vitórias acima do que os pontos indicam`));
  facts.push(fact('Mais azarado', f1(lucky[lucky.length - 1].luck), `${esc(ownerName(lucky[lucky.length - 1].rid))} perdeu jogos que merecia ganhar`));
  if (act[0]?.moves) facts.push(fact('Mais ativo', act[0].moves, `${esc(ownerName(act[0].rid))} · movimentações na temporada`));
  if (st.waiver_type === 2 && spend[0]?.faab) facts.push(fact('Mais FAAB gasto', '$' + spend[0].faab, `${esc(ownerName(spend[0].rid))} · de $${st.waiver_budget}`));
  if (ls.pickups[0]) facts.push(fact('Melhor achado do waiver', f1(ls.pickups[0].pts), `${pname(ls.pickups[0].pid)} · pontos como titular de ${esc(ownerName(ls.pickups[0].rid))}${ls.pickups[0].bid ? ` ($${ls.pickups[0].bid})` : ''}`));
  html += `<section class="panel c5"><h2>Curiosidades</h2><div class="facts">${facts.join('')}</div></section>`;
  const feed = ls.tx.slice().sort((a, b) => b.status_updated - a.status_updated).slice(0, 40);
  const kind = { trade: ['Troca', 'info'], waiver: ['Waiver', 'good'], free_agent: ['Livre', ''], commissioner: ['Comissário', 'warn'] };
  html += `<section class="panel c7"><h2>Movimentações da liga</h2><div class="stack" style="gap:0">${feed.length ? feed.map(t => {
    const k = kind[t.type] || [t.type, ''];

// Playoff picture: seeds se a temporada acabasse hoje, garantidos/eliminados pela matemática e chaveamento
function playoffPicture(sim) {
  const P = sim.P, pws = sim.pws, rem = Math.max(0, pws - S.week), my = S.myRoster?.roster_id;
  const T = S.rosters.map(r => { const s = r.settings; const w = (s.wins || 0) + (s.ties || 0) * 0.5;
    const opp = []; for (let wk = S.week; wk < pws; wk++) { const ms = wk === S.week ? S.matchups : S.mfut?.[wk] || []; const me = ms.find(m => m.roster_id === r.roster_id); const o = me && ms.find(m => m.matchup_id === me.matchup_id && m.roster_id !== r.roster_id); if (o) opp.push(o.roster_id); }
    return { rid: r.roster_id, w, l: s.losses || 0, pf: (s.fpts || 0) + (s.fpts_decimal || 0) / 100, max: w + rem, opp, sos: opp.length ? avg(opp.map((o, i) => sim.mean[o]?.[S.week + i] || 0)) : null }; });
  T.sort((a, b) => b.w - a.w || b.pf - a.pf);
  T.forEach((t, i) => {
    t.seed = i + 1;
    // Garantido: menos de P outros times conseguem alcançar as vitórias atuais dele (empate conta como ameaça)
    t.clinched = T.filter(o => o !== t && o.max >= t.w).length < P;
    // Eliminado: pelo menos P times já têm mais vitórias do que ele consegue alcançar
    t.elim = T.filter(o => o !== t && o.w > t.max).length >= P;
  });
  const cut = T[P - 1]; T.forEach(t => t.gb = Math.max(0, cut.w - t.w));
  return { T, P, rem, pws, my, nBye: sim.nBye };
}

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="Pontos por semana">`;
  for (const t of ticks) svg += `<line x1="${pl}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  if (a) svg += `<line x1="${pl}" x2="${W - 10}" y1="${y(a.ppg)}" y2="${y(a.ppg)}" stroke="var(--accent)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W - 12}" y="${y(a.ppg) - 5}" text-anchor="end">média ${f1(a.ppg)}</text>`;
  for (let w = 1; w <= maxW; w++) {
    const x = pl + (w - 1) * bw; const e = log.find(l => l.w === w);
    svg += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${w}</text>`;
    if (e) { const hgt = Math.max(1, y(0) - y(e.pts)); svg += `<rect x="${x + bw * 0.18}" y="${y(e.pts)}" width="${bw * 0.64}" height="${hgt}" rx="2" fill="${a && e.pts >= a.ppg ? 'var(--accent)' : 'var(--muted)'}"><title>Semana ${w}: ${f1(e.pts)} pts vs ${e.opp}</title></rect><text x="${x + bw / 2}" y="${y(e.pts) - 4}" text-anchor="middle">${Math.round(e.pts)}</text>`; }
  }
  return svg + '</svg>';
}
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; m.dataset.pid = ''; document.body.style.overflow = ''; }

/* ====================== EVENTOS ====================== */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]') || t.id === 'modal') { closeModal(); return; }
  const pl = t.closest('[data-player]'); if (pl && pl.dataset.player && pl.dataset.player !== 'undefined') { e.preventDefault(); $('#modal').dataset.pid = pl.dataset.player; openPlayer(pl.dataset.player); return; }
  const tm = t.closest('[data-team]'); if (tm) { S.ui.pteam = tm.dataset.team; S.ui.ppos = 'ALL'; S.ui.pq = ''; location.hash = 'jogadores'; return; }
  const b = t.closest('button'); if (!b) return;
  if (b.dataset.wpos) { S.ui.wpos = b.dataset.wpos; render(); }
  else if (b.dataset.nfil) { S.ui.nfil = b.dataset.nfil; render(); }
  else if (b.dataset.nsrc) { S.ui.nsrc = b.dataset.nsrc; render(); }
  else if (b.dataset.ifil) { S.ui.ifil = b.dataset.ifil; render(); }
  else if (b.dataset.ipos) { S.ui.ipos = b.dataset.ipos; render(); }
  else if (b.dataset.ppos) { S.ui.ppos = b.dataset.ppos; S.ui.plimit = 96; render(); }
  else if (b.id === 'pmore') { S.ui.plimit += 96; render(); }
  else if (b.dataset.league) { selectLeague(b.dataset.league); }
  else if (b.id === 'notif') { try { Notification.requestPermission().then(() => render()); } catch {} }
  else if (b.id === 'clearcache') { DB.clear().then(() => location.reload()); }
  else if (b.id === 'disconnect') { LS.set('cfg', {}); location.reload(); }
  else if (b.id === 'bskyreset') { LS.set('bsky', BSKY_DEFAULT); render(true); }
  else if (b.dataset.cpos) { S.ui.cpos = b.dataset.cpos; render(); }
  else if (b.dataset.idea != null) {
    const [k, i] = b.dataset.idea.split(':'); const x = (k === '3' ? S.ideas3 : S.ideas)?.[+i];
    if (x) { S.ui.tr = { teams: [...x.teams], moves: { ...x.moves }, faab: JSON.parse(JSON.stringify(x.faab || {})) }; render(); setTimeout(() => document.querySelector('.verdict')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50); }
  }
  else if (b.id === 'find3') { b.disabled = true; b.innerHTML = '<span class="load"></span> Buscando…'; setTimeout(() => { try { S.ideas3 = tradeIdeas3(); } catch (e) { logMsg('3 times: ' + e.message); S.ideas3 = []; } render(); }, 30); }
  else if (b.dataset.rmteam) { const t = S.ui.tr; t.teams = t.teams.filter(r => r !== +b.dataset.rmteam); render(); }
  else if (b.id === 'trclear') { S.ui.tr = null; render(); }
  else if (b.id === 'runbt') { b.disabled = true; b.innerHTML = '<span class="load"></span> Calculando…'; backtest().then(() => render()).catch(e => { b.textContent = 'Erro: ' + e.message; }); }
  else if (b.id === 'ntfytest') { ntfySend('War Room: teste', 'Se você recebeu isto, os alertas vão chegar no celular.', 3, true).then(ok => { $('#ntfymsg').textContent = ok ? 'Enviado. Confira o app ntfy.' : 'Falhou. Verifique a conexão.'; }); }
});
document.addEventListener('change', e => {
  const t = e.target;
  const tr = S.ui.tr;
  if (t.dataset.mv) { const pid = t.dataset.mv; if (t.checked) tr.moves[pid] = defaultDest(tr, +t.dataset.from); else delete tr.moves[pid]; render(); }
  else if (t.dataset.dest) { tr.moves[t.dataset.dest] = +t.value; render(); }
  else if (t.dataset.faab) { const rid = t.dataset.faab; const amt = Math.max(0, Math.round(+t.value || 0)); if (amt) tr.faab[rid] = { amt, to: tr.faab[rid]?.to ?? defaultDest(tr, +rid) }; else delete tr.faab[rid]; render(); }
  else if (t.dataset.faabto) { const rid = t.dataset.faabto; tr.faab[rid] = { amt: tr.faab[rid]?.amt || 0, to: +t.value }; render(); }
  else if (t.id === 'addteam' && t.value) { tr.teams.push(+t.value); render(); }
  else if (t.id === 'swapteam') { tr.teams = [tr.teams[0], +t.value]; render(); }
  else if (t.id === 'pteam') { S.ui.pteam = t.value; S.ui.plimit = 96; render(); }
  else if (t.id === 'ntfyon') { LS.set('ntfy', { ...ntfyCfg(), on: t.checked }); }
});
let qT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pq') { clearTimeout(qT); qT = setTimeout(() => { S.ui.pq = t.value; S.ui.plimit = 96; render(); }, 180); }
  if (t.id === 'nq') { clearTimeout(qT); qT = setTimeout(() => { S.ui.nq = t.value; render(); }, 180); }
});
document.addEventListener('submit', async e => {
  if (e.target.id === 'bskyform') {
    e.preventDefault();
    const list = $('#bskyh').value.split(/[\s,;]+/).map(h => h.replace(/^@/, '').trim()).filter(Boolean).map(h => h.includes('.') ? h : h + '.bsky.social');
    LS.set('bsky', list); $('#bskymsg').innerHTML = '<span class="load"></span> Buscando posts…';
    await loadInsiders(true).catch(err => logMsg('Bluesky: ' + err.message));
    $('#bskymsg').textContent = `${S.insiders.length} posts dos últimos 14 dias carregados.`; computeAlerts(); return;
  }
  if (e.target.id !== 'connect') return; e.preventDefault();
  const u = $('#cuser').value.trim(); const msg = $('#cmsg'); if (!u) return;
  msg.innerHTML = '<span class="load"></span> Buscando…';
  try {
    const user = await getJSON(API.user(u)); if (!user || !user.user_id) throw new Error('Usuário não encontrado no Sleeper.');
    const leagues = await getJSON(API.leagues(user.user_id, S.season));
    LS.set('cfg', { ...cfg(), username: u, userId: user.user_id });
    if (!leagues.length) { msg.textContent = `Nenhuma liga de ${S.season} encontrada para ${u}.`; return; }
    if (leagues.length === 1) { selectLeague(leagues[0].league_id); return; }
    msg.textContent = 'Escolha a liga:';
    $('#leaguepick').innerHTML = leagues.map(l => `<button class="btn" data-league="${l.league_id}" style="text-align:left">${esc(l.name)} <span class="muted">· ${l.total_rosters} times · ${l.scoring_settings?.rec === 1 ? 'PPR' : l.scoring_settings?.rec === 0.5 ? 'Half-PPR' : 'Standard'}</span></button>`).join('');
  } catch (err) { msg.textContent = err.message; }
});
async function selectLeague(id) {
  LS.set('cfg', { ...cfg(), leagueId: id }); status('Carregando liga…');
  try {
    await loadLeague(); buildAnalytics(); await loadMyExtras(); S.nameIdx = null;
    S.mhist = {}; S.mfut = {}; S.txw = {}; S.histReady = false;
    await Promise.allSettled([loadMarket(), loadInsiders(true), loadLeagueHistory()]);
    S.slros = {}; S.slrosReady = false; loadSleeperRos().catch(e => logMsg('ROS Sleeper: ' + e.message));
    computeAlerts(); location.hash = 'painel'; render(true); status('Liga conectada');
  }
  catch (e) { status('Erro na liga: ' + e.message); }
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ====================== TEMA ====================== */
function applyTheme() { const t = LS.get('theme', 'system'); if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; $('#theme').textContent = 'Tema: ' + ({ system: 'sistema', dark: 'escuro', light: 'claro' }[t]); }
$('#theme').onclick = () => { const order = ['system', 'dark', 'light']; LS.set('theme', order[(order.indexOf(LS.get('theme', 'system')) + 1) % 3]); applyTheme(); };

/* ====================== ATUALIZAÇÃO ====================== */
let lastSlow = 0;
async function tick(force) {
  try {
    await Promise.allSettled([loadScoreboard(), loadMatchups()]);
    await Promise.allSettled([loadOdds(force), loadWeather(force), loadInsiders(force)]);
    // Dia de jogo: status dos titulares com kickoff nas próximas 3 h, a cada 3 min (inativos saem ~90 min antes)
    const soon = gameDayStarters();
    if (soon.length && (force || Date.now() - (S.tGd || 0) > 180e3)) { S.tGd = Date.now(); await loadEspnFantasy(soon).catch(() => {}); }
    if (force || Date.now() - lastSlow > 600e3) {
      lastSlow = Date.now();
      await Promise.allSettled([loadNews(), loadTrending(), loadMyExtras(),
        cfg().leagueId ? getJSON(API.tx(cfg().leagueId, S.week)).then(d => { (S.txw ||= {})[S.week] = d; }) : null]);
    }
    computeAlerts(); notifyNew();
    S.updated = Date.now(); status('Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    if (!$('#modal').hidden) return renderTabs();
    render();
  } catch (e) { logMsg('Atualização: ' + e.message); }
  finally { clearTimeout(S.timer); S.timer = setTimeout(tick, S.sb.some(g => g.state === 'in') ? 30e3 : gameDayStarters().length ? 60e3 : 300e3); }
}
function gameDayStarters() {
  if (!S.myRoster) return [];
  return (S.myRoster.starters || []).filter(pid => { const g = gameOf(S.players[pid]?.team); if (!g || g.state !== 'pre') return false; const dt = Date.parse(g.date) - Date.now(); return dt < 3 * 3600e3 && dt > -600e3; });
}
$('#refresh').onclick = () => tick(true);

async function boot() {
  applyTheme(); route();
  status('Conectando à NFL…');
  await loadState(); render();
  await Promise.allSettled([
    loadPlayers().catch(e => logMsg('Jogadores: ' + e.message)),
    loadSchedule().catch(e => logMsg('Calendário: ' + e.message)),
    loadScoreboard().catch(e => logMsg('Placar: ' + e.message)),
    loadTrending().catch(e => logMsg('Trending: ' + e.message)),
  ]);
  render();
  await Promise.allSettled([
    loadNews().catch(e => logMsg('Notícias: ' + e.message)),
    loadLeague().catch(e => { logMsg('Liga: ' + e.message); status('Erro ao carregar a liga'); }),
  ]);
  render();
  status('Carregando estatísticas da temporada…');
  await Promise.allSettled([loadProj(S.week).catch(e => logMsg('Projeções: ' + e.message)), loadStatsAll().catch(e => logMsg('Estatísticas: ' + e.message)),
    loadLeagueHistory().catch(e => logMsg('Histórico da liga: ' + e.message))]);
  buildAnalytics(); render();
  status('Buscando projeções ESPN e notícias do elenco…');
  if (S.myRoster) await loadMyExtras().catch(e => logMsg('ESPN: ' + e.message));
  else await loadEspnAll().catch(e => logMsg('ESPN ranking: ' + e.message));
  computeReplacement();
  status('Buscando consenso, odds, clima e insiders…');
  await Promise.allSettled([
    loadMarket().catch(e => logMsg('FantasyPros/FantasyCalc: ' + e.message)),
    loadOdds(true).catch(e => logMsg('Odds: ' + e.message)),
    loadWeather(true).catch(e => logMsg('Clima: ' + e.message)),
    loadInsiders(true).catch(e => logMsg('Bluesky: ' + e.message)),
  ]);
  loadSleeperRos().then(() => { if (cur === 'trocas') render(); }).catch(e => logMsg('ROS Sleeper: ' + e.message));
  lastSlow = Date.now();
  computeAlerts(); notifyNew(); render();
  status('Atualizado ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
  S.timer = setTimeout(tick, S.sb.some(g => g.state === 'in') ? 30e3 : 300e3);
}
boot();
</script>
